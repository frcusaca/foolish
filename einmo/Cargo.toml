[package]
name = "einmo"
version = "0.1.0"
edition = "2024"
description = "Directory-based signed-snapshot testing with staged promotion"

[dependencies]
ed25519-dalek = "2"
argon2 = "0.5"
base64 = "0.22"
hex = "0.4"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
time = { version = "0.3", features = ["macros", "formatting", "parsing"] }
thiserror = "2"
rand = "0.8"
sha2 = "0.10"
similar = "2"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "einmo"
path = "src/main.rs"

[[bin]]
name = "cargo-einmo"
path = "src/bin/cargo_einmo.rs"

[lints.rust]
unsafe_code = "warn"
