[package]
name = "foolish-core"
version = "0.1.0"
edition = "2024"

[dependencies]
foolish-parser = { path = "../foolish-parser" }
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true }
rayon = { version = "1", optional = true }
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
argon2 = "0.5.3"
base64 = "0.22"
hex = "0.4"

[dev-dependencies]
insta = { workspace = true }
num_cpus = "1"

[features]
parallel-snapshot = ["rayon"]

[[bin]]
name = "verify_signatures"
path = "src/bin/verify_signatures.rs"

[lints.rust]
unsafe_code = "warn"
