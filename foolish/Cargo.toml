[workspace]
members = [
    "foolish-parser",
    "foolish-core",
    "foolish-cli",
    "foolish-ubca",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
regex = "1"
anyhow = "1"
bon = "3"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
insta = { version = "1", features = ["yaml"] }
time = { version = "0.3", features = ["macros", "formatting"] }

[workspace.lints.rust]
unsafe_code = "warn"

[profile.release]
opt-level = 3
lto       = true
strip     = true
debug = 0

[profile.dev]
codegen-units = 256
debug = 1
opt-level = 0

[profile.test]
opt-level = 1           # Slightly optimize tests for faster execution
debug = 1
debug-assertions = true # Keep safety checks enabled
panic = "unwind"        # Catch panics per-test, not process-wide (FOOP-62 §3.4)

[build]
jobs = 16
