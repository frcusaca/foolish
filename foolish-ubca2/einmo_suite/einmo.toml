# einmo suite configuration — FOOP-36 rendering contract
#
# This suite is deliberately separate from `einmo_suite`: its checked artifact
# was written from FOOP-36 before the Foolish renderer was implemented. Output
# uses the computer key; checked uses a suite-specific key. Verified remains
# unconfigured so only an interactive human promotion can create that tier.

[signing.output]
passphrase = ""

[signing.checked]
passphrase = "foolish-ubca2-suite2"

[suite]
# Keep einmo's default `①` (U+2460) + LF separator, matching the sibling ubca2
# suite. Neither INPUT nor OUTPUT may contain that separator sequence.
walk_depth_limit = 32
