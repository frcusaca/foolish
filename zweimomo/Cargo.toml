[package]
name = "zweimomo"
version = "0.1.0"
edition = "2024"
description = "Einmo's companion test crate: three pure-Rust Evaluator impls (Foolish/Python/JS) exercising einmo's signed-snapshot pipeline."
license = "MIT OR Apache-2.0"

# Zweimomo depends on the foolish crates (for the Foolish adapter) and einmo
# (the framework under test). Einmo itself never depends on the foolish crates.
[dependencies]
einmo = { path = "../einmo" }
foolish-ubca = { path = "../foolish-ubca" }
foolish-core = { path = "../foolish-core" }
# Exact pins: interpreter output text is part of the signed baselines, so a
# version bump is at least a minor zweimomo bump and implies a corpus re-review.
rustpython-vm = "=0.5.0"
boa_engine = "=0.21.1"

[dev-dependencies]
tempfile = "3"
